[project]
name = "code-review"
version = "0.1.0"
description = "A code review project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "mypy>=2.3.1",
    "psycopg[binary]>=3.3.5",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]
[tool.ruff]
# Target Python version 3.10 (matches your project settings)
target-version = "py310"

# Set the maximum line width to 88 characters (standard Python practice)
line-length = 88

[tool.ruff.lint]
# Select the rules you want Ruff to enforce
# E/W = Pycodestyle (standard formatting)
# F   = Pyflakes (catches logical bugs and unused imports)
# I   = Isort (automatically sorts your imports alphabetically)
select = ["E", "W", "F", "I"]

# Tell Ruff to ignore specific rules if you find them annoying
ignore = []

[tool.ruff.lint.isort]
# Combines your "from x import y" lines cleanly if they come from the same place
combine-as-imports = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
